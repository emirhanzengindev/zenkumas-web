<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ürünler | Zen Kumaş Yönetim</title>
    <meta name="description" content="Zen Kumaş yönetim paneli ürün listesi.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="../favicon.ico" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700;800&display=swap&subset=latin,latin-ext" rel="stylesheet" />

    <!-- Tailwind + tema tokenları -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../assets/js/theme.js"></script>

    <link rel="stylesheet" href="../assets/css/admin.css" />
</head>
<body class="bg-cream text-ink" data-admin-page="products" data-admin-nav="products">

    <div id="admin-layout"></div>

    <div class="admin-main flex-1 min-w-0">
        <header class="admin-topbar">
            <div class="flex items-center gap-3 min-w-0">
                <button type="button" id="admin-menu-toggle" class="admin-menu-toggle" aria-label="Menüyü aç">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
                <h1 class="font-display text-lg font-bold truncate">Ürünler</h1>
            </div>
            <a href="urun-duzenle.html" class="admin-btn admin-btn--primary hidden sm:inline-flex !py-2 !px-4 text-sm">
                + Yeni Ürün
            </a>
        </header>

        <main id="products-app" class="p-4 sm:p-6 lg:p-8 space-y-5">

            <!-- Filtreler -->
            <section class="admin-card p-4 sm:p-5">
                <div class="admin-filters">
                    <div>
                        <label for="filter-q" class="admin-label">Ürün adı / renk ara</label>
                        <input type="search" id="filter-q" class="admin-input" placeholder="örn. Soho" autocomplete="off">
                    </div>
                    <div>
                        <label for="filter-kategori" class="admin-label">Kategori</label>
                        <select id="filter-kategori" class="admin-select">
                            <option value="">Tüm kategoriler</option>
                        </select>
                    </div>
                    <div>
                        <label for="filter-yayinda" class="admin-label">Yayın durumu</label>
                        <select id="filter-yayinda" class="admin-select">
                            <option value="">Tümü</option>
                            <option value="true">Yayında</option>
                            <option value="false">Taslak</option>
                        </select>
                    </div>
                    <button type="button" id="filter-reset" class="admin-btn admin-btn--secondary !py-2.5">Filtreleri temizle</button>
                </div>
                <p class="text-xs text-ink-muted mt-3"><span id="kategori-count"></span></p>
            </section>

            <!-- Tablo -->
            <section id="list-refresh" class="admin-card">
                <div class="admin-table-wrap">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Ürün</th>
                                <th>Kategori</th>
                                <th>Fiyat</th>
                                <th>Stok</th>
                                <th>Durum</th>
                                <th>Foto</th>
                                <th class="text-right">İşlemler</th>
                            </tr>
                        </thead>
                        <tbody id="products-tbody"></tbody>
                    </table>
                </div>

                <!-- Boş durum -->
                <div id="products-empty" class="hidden px-6 py-14 text-center">
                    <p class="font-display text-lg font-bold text-ink mb-1">Kayıt bulunamadı</p>
                    <p class="text-sm text-ink-muted">Arama ve filtre kriterlerinize uyan ürün yok. Filtreleri temizleyebilir veya yeni ürün ekleyebilirsiniz.</p>
                    <a href="urun-duzenle.html" class="admin-btn admin-btn--primary inline-flex mt-5">+ Yeni Ürün</a>
                </div>

                <!-- Hata durumu -->
                <div id="products-error" class="hidden px-6 py-14 text-center">
                    <p class="font-display text-lg font-bold text-ink mb-1">Liste yüklenemedi</p>
                    <p class="text-sm text-red-700 mb-5" data-err-text></p>
                    <button type="button" id="btn-retry" class="admin-btn admin-btn--secondary">Tekrar dene</button>
                </div>

                <!-- Sayfalama -->
                <div id="products-pagination" class="admin-pagination px-4 sm:px-5">
                    <span class="admin-pagination__info" data-pg-info></span>
                    <div class="flex gap-2">
                        <button type="button" data-pg-prev class="admin-iconbtn">← Önceki</button>
                        <button type="button" data-pg-next class="admin-iconbtn">Sonraki →</button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        // Düzenleme modunda "Ürünler" menüsü aktif kalsın (admin.js DOMContentLoaded'dan önce).
        if (new URLSearchParams(location.search).get('id')) document.body.dataset.adminNav = 'products';
    </script>
    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/admin.js"></script>
    <script src="../assets/js/admin-products.js"></script>
</body>
</html>
