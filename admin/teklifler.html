<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teklif Talepleri | Zen Kumaş Yönetim</title>
    <meta name="description" content="Zen Kumaş yönetim paneli müşteri teklif talepleri.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="../favicon.ico" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700;800&display=swap&subset=latin,latin-ext" rel="stylesheet" />

    <!-- Tailwind + tema tokenları -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../assets/js/theme.js"></script>

    <link rel="stylesheet" href="../assets/css/admin.css" />
</head>
<body class="bg-cream text-ink" data-admin-page="leads" data-admin-nav="leads">

    <div id="admin-layout"></div>

    <div class="admin-main flex-1 min-w-0">
        <header class="admin-topbar">
            <div class="flex items-center gap-3 min-w-0">
                <button type="button" id="admin-menu-toggle" class="admin-menu-toggle" aria-label="Menüyü aç">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
                <h1 class="font-display text-lg font-bold truncate">Teklif Talepleri</h1>
            </div>
            <span id="leads-new-count" class="text-sm text-ink-muted"></span>
        </header>

        <main id="leads-app" class="p-4 sm:p-6 lg:p-8 space-y-5">

            <!-- E-posta bildirimi kapalıysa bilgi notu -->
            <div id="leads-mail-note" class="hidden admin-card p-4 text-sm text-ink-soft">
                E-posta bildirimi henüz ayarlı değil: yeni talepler yalnızca bu sayfada görünür.
                Bildirim almak için backend'de SMTP ayarlarının yapılması gerekir.
            </div>

            <section class="admin-card p-4 sm:p-5">
                <div class="admin-filters">
                    <div>
                        <label for="filter-durum" class="admin-label">Durum</label>
                        <select id="filter-durum" class="admin-select">
                            <option value="">Tümü</option>
                            <option value="yeni">Yeni</option>
                            <option value="okundu">Okundu</option>
                            <option value="tamamlandi">Tamamlandı</option>
                        </select>
                    </div>
                    <button type="button" id="btn-refresh" class="admin-btn admin-btn--secondary !py-2.5">Yenile</button>
                </div>
            </section>

            <section id="leads-list" class="space-y-3" aria-live="polite"></section>

            <div id="leads-empty" class="hidden admin-card px-6 py-14 text-center">
                <p class="font-display text-lg font-bold text-ink mb-1">Talep yok</p>
                <p class="text-sm text-ink-muted">Bu filtreye uyan teklif talebi bulunmuyor.</p>
            </div>

            <div id="leads-error" class="hidden admin-card px-6 py-14 text-center">
                <p class="font-display text-lg font-bold text-ink mb-1">Talepler yüklenemedi</p>
                <p class="text-sm text-red-700 mb-5" data-err-text></p>
                <button type="button" id="btn-retry" class="admin-btn admin-btn--secondary">Tekrar dene</button>
            </div>

            <div id="leads-pagination" class="admin-pagination">
                <span class="admin-pagination__info" data-pg-info></span>
                <div class="flex gap-2">
                    <button type="button" data-pg-prev class="admin-iconbtn">← Önceki</button>
                    <button type="button" data-pg-next class="admin-iconbtn">Sonraki →</button>
                </div>
            </div>
        </main>
    </div>

    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/admin.js"></script>
    <script src="../assets/js/admin-teklifler.js"></script>
</body>
</html>
